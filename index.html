.mc{font-family:"Minecraft","Press Start 2P",monospace;font-weight:400;color:#fff;letter-spacing:.06em;text-shadow:.08em .08em 0 #3f3f3f;margin:0;line-height:1.1;font-size:clamp(44px,15vw,110px)}
.sub{font-size:clamp(22px,6vw,34px);margin:0;font-weight:600}
.box{background:var(--cream);border:4px solid var(--berry);box-shadow:6px 6px 0 var(--berry);padding:14px 18px;max-width:420px}
.btn{font:inherit;font-size:20px;color:var(--berry);background:var(--butter);border:4px solid var(--berry);box-shadow:5px 5px 0 var(--berry);padding:10px 22px;cursor:pointer}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--berry)}
.btn:focus-visible{outline:4px dashed var(--pink);outline-offset:4px}
.blink{animation:blink 1.2s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
/* character */
.char{width:var(--w);height:var(--h);background-repeat:no-repeat;background-size:auto 100%;image-rendering:pixelated;
 animation:play calc(var(--n)/var(--fps)*1s) steps(var(--n)) infinite}
@keyframes play{to{background-position-x:calc(var(--w)*var(--n)*-1)}}
.char.fallback{animation:bob 1s steps(2) infinite;background:none;display:grid;place-items:center;}
@keyframes bob{50%{transform:translateY(-6px)}}
.char.fallback img{width:100%;height:100%;object-fit:cover;border:4px solid var(--berry);box-shadow:5px 5px 0 var(--berry)}
/* cake */
#stage{position:relative;width:300px;height:300px}
#cake{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#cakeFallback{position:absolute;left:30px;right:30px;bottom:20px;height:130px;background:var(--cream);border:4px solid var(--berry);box-shadow:6px 6px 0 var(--berry)}
#cakeFallback::before{content:"";position:absolute;left:-4px;right:-4px;top:-4px;height:44px;background:var(--pink);border:4px solid var(--berry)}
.candle{position:absolute;width:0;height:0}
.flame{position:absolute;left:50%;top:-24px;width:14px;height:22px;margin-left:-7px;background:#ffc800;border:3px solid #ff8a00;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;animation:flick .3s steps(2) infinite;transform-origin:bottom}
@keyframes flick{50%{transform:scale(.9,1.1) rotate(4deg)}}
.candle.off .flame{display:none}
.candle.off::after{content:"";position:absolute;left:2px;top:-30px;width:6px;height:6px;background:#cfc;opacity:0;animation:smoke 1.4s ease-out}
@keyframes smoke{0%{opacity:.9}100%{opacity:0;transform:translateY(-40px)}}
.bar{position:relative;width:min(320px,86vw);height:34px;border:4px solid var(--berry);background:var(--cream);box-shadow:5px 5px 0 var(--berry);cursor:pointer;touch-action:manipulation}
.zone{position:absolute;top:0;bottom:0;background:var(--pink);border-left:4px solid var(--berry);border-right:4px solid var(--berry)}
.cursor{position:absolute;top:-8px;bottom:-8px;width:10px;margin-left:-5px;background:var(--berry);border:2px solid var(--cream)}
.bar.miss{animation:shake .25s steps(4)}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* memories */
#memories{padding:0}
.show{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:14px;padding:14px}
.frame{position:relative;flex:1;min-height:0;border:4px solid var(--berry);box-shadow:6px 6px 0 var(--berry);background:var(--cream);overflow:hidden;display:grid;place-items:center;animation:pop .3s steps(3)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.frame .bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(18px) brightness(1.05);opacity:.7}
.frame .fg{position:relative;width:100%;height:100%;object-fit:contain}
.frame .ph{font-size:80px;color:var(--pink)}
.frame .end{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav .btn:disabled{opacity:.4;cursor:default}
#count{font-size:20px}
.confetti{position:fixed;top:-12px;width:10px;height:10px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.blink,.flame,.char{animation:none}.confetti{display:none}}
</style>
</head>
<body>

<section id="start" class="screen on">
  <div class="blink">♡ ☆ ♡</div>
  <h1 class="mc" id="name"></h1>
  <p class="sub">Happy Birthday!</p>
  <div id="startChar"></div>
  <button class="btn" id="startBtn">Press start</button>
</section>

<section id="game" class="screen">
  <div class="box" id="say">Tap when the line is in the pink zone to blow out a candle!</div>
  <div id="stage"><div id="cakeFallback"></div><img id="cake" alt="" hidden></div>
  <div class="bar" id="bar"><div class="zone" id="zone"></div><div class="cursor" id="cursor"></div></div>
  <div id="gameChar"></div>
  <button class="btn" id="tapBtn">Tap!</button>
</section>

<section id="memories" class="screen">
  <div class="show">
    <div class="frame" id="frame"></div>
    <div class="nav">
      <button class="btn" id="prev">◀ Back</button>
      <span id="count"></span>
      <button class="btn" id="next">Next ▶</button>
    </div>
  </div>
</section>

<script>
/* ================= EDIT ME ================= */
const CONFIG = {
  name: "Lara",
  message: "Wishing you the cutest, happiest year ever. I’m so glad you’re my friend ♡",
  // Your chibi animation: a horizontal sprite sheet (all frames in ONE row).
  // frames = number of frames, frameW/frameH = size of ONE frame in px (display size).
  character: { src: "character.png", frames: 4, frameW: 128, frameH: 128, fps: 6 },
  // Your decorated cake picture (transparent PNG, square works best).
  cake: "cake.png",
  // Where candles sit on the cake, in % of the 300x300 cake area. Add or remove as you like.
  candles: [[31,26],[43,26],[57,26],[69,26]],
  // Photos you save from Pinterest into the images/ folder.
  photos: ["images/1.jpg","images/2.jpg","images/3.jpg","images/4.jpg","images/5.jpg","images/6.jpg"]
};
/* ============================================ */

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll(".screen").forEach(s => s.classList.remove("on")); $(id).classList.add("on"); };
document.title = `Happy Birthday ${CONFIG.name} ♡`;
$("name").textContent = CONFIG.name.toUpperCase();

// character (falls back to a little emoji if the image is missing)
function makeChar(target){
  const c = CONFIG.character, el = document.createElement("div");
  el.className = "char";
  el.style.cssText = `--w:${c.frameW}px;--h:${c.frameH}px;--n:${c.frames};--fps:${c.fps}`;
  const img = new Image();
  img.onload = () => { el.style.backgroundImage = `url(${c.src})`; };
  img.onerror = () => { el.className = "char fallback"; el.innerHTML = '<img src="cat.jpg" alt="">'; };
  img.src = c.src;
  $(target).appendChild(el);
}
makeChar("startChar"); makeChar("gameChar");

// cake image (falls back to the drawn cake)
const cakeImg = $("cake"), probe = new Image();
probe.onload = () => { cakeImg.src = CONFIG.cake; cakeImg.hidden = false; $("cakeFallback").hidden = true; };
probe.src = CONFIG.cake;

// candles
const candles = CONFIG.candles.map(([x,y]) => {
  const c = document.createElement("div");
  c.className = "candle";
  c.style.left = x + "%"; c.style.top = y + "%";
  c.innerHTML = '<div class="flame"></div>';
  $("stage").appendChild(c);
  return c;
});

// photo slideshow (photos, then a final message slide)
const slides = [...CONFIG.photos, null];
let cur = 0;
function render(){
  const f = $("frame"), src = slides[cur];
  const fresh = f.cloneNode(false); f.replaceWith(fresh); fresh.id = "frame";
  if(src){
    const bg = new Image(), fg = new Image();
    bg.className = "bg"; fg.className = "fg"; bg.alt = ""; fg.alt = "";
    bg.src = fg.src = src;
    fg.onerror = () => { bg.remove(); const p = document.createElement("div"); p.className = "ph"; p.textContent = "♡"; fg.replaceWith(p); };
    fresh.append(bg, fg);
  }else{
    fresh.innerHTML = '<div class="end"><h1 class="mc"></h1><div class="box"></div></div>';
    fresh.querySelector("h1").textContent = "HAPPY BDAY " + CONFIG.name.toUpperCase();
    fresh.querySelector(".box").textContent = CONFIG.message;
    confetti();
  }
  $("count").textContent = (cur+1) + " / " + slides.length;
  $("prev").disabled = cur === 0;
  $("next").textContent = cur === slides.length-1 ? "Replay ♡" : "Next ▶";
}
function go(d){ cur = d > 0 && cur === slides.length-1 ? 0 : Math.max(0, Math.min(slides.length-1, cur+d)); render(); }
$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
document.addEventListener("keydown", e => {
  if(!$("memories").classList.contains("on")) return;
  if(e.key === "ArrowRight") go(1); if(e.key === "ArrowLeft") go(-1);
});
let sx = null;
$("memories").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive:true});
$("memories").addEventListener("touchend", e => {
  if(sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if(Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
});

// timing mini game
let out = 0, finished = false, raf = 0, pos = 0, dir = 1, speed = 0.9, zoneW = 0.26, zoneX = 0.4, last = 0, playing = false;
function newZone(){
  zoneW = Math.max(0.14, 0.26 - out*0.04);
  zoneX = 0.1 + Math.random()*(0.8 - zoneW);
  $("zone").style.left = zoneX*100 + "%"; $("zone").style.width = zoneW*100 + "%";
}
function loop(t){
  const dt = Math.min((t - last)/1000, 0.05); last = t;
  pos += dir*speed*dt;
  if(pos >= 1){ pos = 1; dir = -1; } else if(pos <= 0){ pos = 0; dir = 1; }
  $("cursor").style.left = pos*100 + "%";
  if(playing) raf = requestAnimationFrame(loop);
}
function tap(){
  if(!playing || finished) return;
  if(pos >= zoneX && pos <= zoneX + zoneW){
    candles[out++].classList.add("off");
    speed += 0.25;
    if(out >= candles.length) return win();
    $("say").textContent = "Nice! " + (candles.length - out) + " to go ♡";
    newZone();
  }else{
    $("say").textContent = "Oops! Try again ✧";
    $("bar").classList.remove("miss"); void $("bar").offsetWidth; $("bar").classList.add("miss");
  }
}
function win(){
  finished = true; playing = false; cancelAnimationFrame(raf);
  $("say").textContent = "Make a wish… ✧";
  $("tapBtn").hidden = true;
  confetti();
  setTimeout(() => { show("memories"); cur = 0; render(); }, 3200);
}
function confetti(){
  const colors = ["#ff8fb1","#ffe9a8","#bfe8d6","#fff"];
  for(let i=0;i<60;i++){
    const p = document.createElement("i"); p.className = "confetti";
    p.style.left = Math.random()*100 + "vw";
    p.style.background = colors[i%4];
    p.style.animationDuration = 2 + Math.random()*2.5 + "s";
    p.style.animationDelay = Math.random()*.6 + "s";
    document.body.appendChild(p); setTimeout(() => p.remove(), 5500);
  }
}
$("tapBtn").onclick = tap;
$("bar").onclick = tap;
document.addEventListener("keydown", e => { if(e.code === "Space" && $("game").classList.contains("on")){ e.preventDefault(); tap(); } });
$("startBtn").onclick = () => { show("game"); newZone(); playing = true; last = performance.now(); raf = requestAnimationFrame(loop); };
</script>
</body>
</html>
